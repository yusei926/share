[workspace]
name = "flip-table-dataset-curation"
version = "0.1.0"
description = "Manual-label-driven curation for Team RAMEN flip-table LeRobot v3 data"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "==3.12.11"
numpy = "==2.2.6"
scipy = "==1.15.2"
pyarrow = "==20.0.0"
pandas = "==2.2.3"
pyyaml = "==6.0.2"
huggingface_hub = "==0.33.4"
ffmpeg = "==7.1.1"
pytest = "==8.4.1"

[activation.env]
PYTHONPATH = "src"

[tasks.audit-labels]
cmd = "python -m flip_table_curation.cli audit-labels"

[tasks.build]
cmd = "python -m flip_table_curation.cli build"

[tasks.validate]
cmd = "python -m flip_table_curation.cli validate"

[tasks.publish]
cmd = "python -m flip_table_curation.cli publish"

[tasks.test]
cmd = "pytest tests -q"
