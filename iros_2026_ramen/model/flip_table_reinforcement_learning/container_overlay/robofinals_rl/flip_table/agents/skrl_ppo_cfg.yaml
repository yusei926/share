seed: 42

models:
  separate: false
  policy:
    class: GaussianMixin
    # RoboFinals exposes an unbounded Gym action space. Each residual action
    # term performs the authoritative [-1, 1] clamp before applying limits.
    clip_actions: false
    clip_log_std: true
    min_log_std: -4.0
    max_log_std: -2.5
    initial_log_std: -2.5
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512, 512, 256]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
      - name: net
        input: OBSERVATIONS
        layers: [512, 512, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 32
  learning_epochs: 8
  mini_batches: 8
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 5.0e-5
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: {}
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 0.5
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0.02
  rewards_shaper_scale: 0.1
  time_limit_bootstrap: true
  experiment:
    directory: flip_table
    experiment_name: residual_ppo
    write_interval: 100
    checkpoint_interval: 2000

trainer:
  class: SequentialTrainer
  timesteps: 2000000
  environment_info: log
