[workspace]
authors = ["Team RAMEN"]
channels = ["conda-forge"]
name = "iros-2026-ramen"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Lower Policy (inference) tests (Issue #39)。SDK-free、default env で動く。
test-lower-policy = "pytest inference/desktop/lower_policy/tests/ -v"

[dependencies]
# default env は lower_policy unit test (`test-lower-policy`) 用の最小構成に絞る。
# pyarrow / huggingface_hub / tqdm / python-dotenv は vit_phase1 preprocess (task 除去済)
# 用だったため drop。YOLO 系は model/yolo_obb sub-workspace 側で持つ。
python = "==3.12.13"
numpy = "==2.5.0"
pytest = "==9.1.1"
pyyaml = "==6.0.3"

[pypi-dependencies]

# YOLO-OBB training は sub-workspace 化: `cd model/yolo_obb && pixi run <task>`
# 参照: model/yolo_obb/pixi.toml (root の runtime feature とは独立、SDK 不要)

# G1 SDK runtime: 実 G1 制御専用 env (Issue #39 Phase C)。
# unitree_sdk2py が cyclonedds==0.10.2 (cp310 wheel only) を hard pin する
# ため base の Python 3.12 とは非互換 → no-default-feature で完全分離。
# 使い方: `pixi run -e runtime python -m inference.desktop.lower_policy.scripts.run_g1_walk_to_table ...`
# 前提: third_party/unitree_sdk2_python が clone 済 (`git clone --depth 1
#   https://github.com/unitreerobotics/unitree_sdk2_python.git third_party/unitree_sdk2_python`)
[feature.runtime.dependencies]
python = "3.10.*"
pytest = "==9.1.1"

[feature.runtime.pypi-dependencies]
cyclonedds = "==0.10.2"
mcap = "==1.3.0"
numpy = "==1.26.4"
opencv-python = "==4.11.0.86"
torch = "==2.12.1"
torchvision = "==0.27.1"
ultralytics = "==8.4.80"
unitree-sdk2py = { path = "third_party/unitree_sdk2_python", editable = true }

# Model discovery, Hub download, contract audit, and adapter-only dry-runs.
# Deliberately excludes Unitree SDK/CycloneDDS so these commands cannot
# initialize a physical transport by importing their environment.
[feature.model-eval.dependencies]
python = "3.10.*"
pytest = "==9.1.1"

[feature.model-eval.pypi-dependencies]
huggingface-hub = "==1.22.0"
numpy = "==1.26.4"
wandb = "==0.24.2"

[environments]
default = { solve-group = "default" }
runtime = { features = ["runtime"], no-default-feature = true }
model-eval = { features = ["model-eval"], no-default-feature = true }
